services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=retail_db
      - POSTGRES_USER=adison
      - POSTGRES_PASSWORD=secret_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adison -d retail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: adisondev/retail-store-api:v1
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=tu_clave_super_secreta_pro_2026
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DATABASE_URL=postgres://adison:secret_pass@db:5432/retail_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: